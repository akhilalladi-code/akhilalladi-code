<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Akhil Alladi — Creative Technologist</title>
  <desc id="desc">A minimal editorial banner with a warm off-white background, electric violet typography, and a subtle geometric grid.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFAFD"/>
      <stop offset="1" stop-color="#F1EDF8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8B5CF6" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#paper)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="1000" cy="180" r="190" fill="#A78BFA" opacity=".18" filter="url(#soft)"/>
  <circle cx="1010" cy="180" r="122" fill="none" stroke="#8B5CF6" stroke-opacity=".22" stroke-width="1.5"/>
  <circle cx="1010" cy="180" r="88" fill="none" stroke="#8B5CF6" stroke-opacity=".34" stroke-width="1.5" stroke-dasharray="3 9"/>
  <path d="M1010 44V316M874 180H1146M914 84L1106 276M1106 84L914 276" stroke="#8B5CF6" stroke-opacity=".22" stroke-width="1.5"/>
  <rect x="72" y="72" width="54" height="5" rx="2.5" fill="url(#violet)"/>
  <text x="72" y="158" fill="#211A2D" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" letter-spacing="-2.6">AKHIL ALLADI</text>
  <text x="76" y="211" fill="#7C3AED" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">CREATIVE TECHNOLOGIST</text>
  <text x="76" y="252" fill="#655C70" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1.1">DESIGN  /  BRAND IDENTITY  /  AI  /  WEB DEVELOPMENT</text>
  <text x="76" y="310" fill="#8B8293" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.6">HYDERABAD · INDIA</text>
  <g fill="url(#violet)">
    <circle cx="1010" cy="58" r="5"/>
    <circle cx="1132" cy="180" r="5"/>
    <circle cx="1010" cy="302" r="5"/>
    <circle cx="888" cy="180" r="5"/>
  </g>
  <path d="M1009 116L1023 166L1074 180L1023 194L1009 244L995 194L944 180L995 166Z" fill="url(#violet)" opacity=".92"/>
  <circle cx="1009" cy="180" r="17" fill="#FBFAFD"/>
</svg>